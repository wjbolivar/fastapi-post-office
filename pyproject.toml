[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "fastapi-post-office"
version = "0.2.0"
description = "Transactional email delivery for FastAPI/Python: versioned templates, DB persistence, Celery retries, and pluggable providers."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "William Bolívar", email = "williamjbolivar@gmail.com" }
]
keywords = ["fastapi", "email", "celery", "sqlalchemy", "jinja2", "transactional-email", "templates"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Framework :: FastAPI",
  "Topic :: Software Development :: Libraries",
  "Topic :: Communications :: Email",
]

dependencies = [
  # Core
  "sqlalchemy[asyncio]>=2.0",
  "jinja2>=3.1.6",
  "pydantic>=2.6",
  "pydantic-settings>=2.14.2",
  "typing-extensions>=4.7; python_version < '3.11'",

  # CLI
  "typer>=0.12",
  "rich>=13.7",
  # Security floors for transitive dependencies.
  "pygments>=2.20.0",
  "python-dotenv>=1.2.2",

  # Utils
  "python-dateutil>=2.9",
]

[project.optional-dependencies]
# Compatibility extra: SMTP uses the Python standard library.
smtp = []

# Celery integration (broker agnostic)
celery = [
  "celery>=5.3",
]

# Admin UI for DEV inspection (optional)
admin = [
  "sqladmin>=0.27.1",
  "itsdangerous>=2.2",
  "starlette>=1.3.1",
  "python-multipart>=0.0.31",
  "anyio>=4.14.2",
  "idna>=3.15",
]

# Common DB drivers (optional; keep core driver-free)
db-postgres = [
  "psycopg[binary]>=3.1",
]
db-mysql = [
  "pymysql>=1.1",
]
db-sqlite-async = [
  "aiosqlite>=0.20",
]

# Observability (optional)
observability = [
  "structlog>=24.1",
]

# Runnable FastAPI example and network integration tests.
fastapi = ["fastapi>=0.115", "uvicorn>=0.30"]
integration = ["aiosmtpd>=1.4.6", "psycopg[binary]>=3.1", "redis>=5", "build>=1.2", "alembic>=1.13", "fastapi>=0.115", "uvicorn>=0.30"]

# Developer tooling
dev = [
  "pytest>=9.0.3",
  "pytest-cov>=5.0",
  "pytest-mock>=3.12",
  "freezegun>=1.4",
  "pip-audit>=2.7",
  "bandit>=1.7",
  "aiosqlite>=0.20",
  "httpx>=0.28",
  "fastapi>=0.115",
  "ruff>=0.6",
  "black>=26.10.1",
  "mypy>=1.10",
  "types-python-dateutil>=2.9",
]

# All-in-one convenient extra for contributors
all = [
  "fastapi-post-office[smtp,celery,admin,db-postgres,db-sqlite-async,observability]",
]

[project.scripts]
fapo = "fastapi_post_office.cli.main:app"

[project.urls]
Homepage = "https://github.com/wjbolivar/fastapi-post-office"
Repository = "https://github.com/wjbolivar/fastapi-post-office"
Issues = "https://github.com/wjbolivar/fastapi-post-office/issues"

[tool.hatch.build.targets.wheel]
packages = ["fastapi_post_office", "fapo"]

[tool.ruff]
line-length = 100
target-version = "py310"
fix = true

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]  # allow long lines where appropriate

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q --strict-markers --disable-warnings --cov=fastapi_post_office --cov-report=term-missing"
testpaths = ["tests"]
markers = ["integration: requires local integration services"]

[tool.coverage.run]
branch = true
source = ["fastapi_post_office"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = false


[tool.hatch.build.targets.sdist]
include = ["/fastapi_post_office", "/fapo", "/tests", "/scripts", "/examples", "/README.md", "/LICENSE", "/pyproject.toml", "/compose.integration.yml"]
