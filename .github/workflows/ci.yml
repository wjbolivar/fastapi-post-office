name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          # Upgrade runner tooling too: older Python images bundle vulnerable setuptools.
          python -m pip install --upgrade pip "setuptools>=84.1.0"
          pip install -e ".[dev,smtp,celery,admin]"

      - name: Lint (ruff)
        run: ruff check --no-fix fastapi_post_office tests fapo scripts examples

      - name: Format check (black)
        run: black --check fastapi_post_office tests fapo scripts examples

      - name: Type check (mypy)
        run: mypy fastapi_post_office fapo

      - name: Run tests
        run: pytest

      - name: Static security analysis
        run: bandit -r fastapi_post_office -ll

      - name: Dependency vulnerability audit
        run: pip-audit

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fapo
          POSTGRES_PASSWORD: fapo-test-only
          POSTGRES_DB: fapo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fapo -d fapo_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      FAPO_TEST_POSTGRES_URL: postgresql+psycopg://fapo:fapo-test-only@127.0.0.1:5432/fapo_test
      FAPO_TEST_BROKER_URL: redis://127.0.0.1:6379/0
      FAPO_TEST_NETWORK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip "setuptools>=84.1.0"
      - run: pip install -e '.[dev,celery,admin,integration]'
      - run: pytest
      - run: python -m build
      - run: python scripts/check_wheel.py dist/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: distribution
          path: dist/
