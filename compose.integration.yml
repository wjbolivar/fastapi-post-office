services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fapo
      POSTGRES_PASSWORD: fapo-test-only
      POSTGRES_DB: fapo_test
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fapo -d fapo_test"]
      interval: 2s
      timeout: 2s
      retries: 30
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
